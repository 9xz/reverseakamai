[workspace]
resolver = "3"
members = ["crates/codec", "crates/solver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
native-payload = { git = "https://github.com/9xz/native-payload" }
wreq = { version = "0.16.1", features = ["gzip", "brotli", "deflate", "zstd", "cookies"] }
wreq-util = { git = "https://github.com/0x676e67/wreq-util", rev = "917d2581d6761a94db66466caa6c2eb4d4cdbd43" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
url = "2"
sha2 = { version = "0.10", features = ["asm"] }
sha1 = { version = "0.10", features = ["asm"] }

[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", rev = "cd76bcdf1307153de289d34e072528bdf0510a3b" }
btls = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
